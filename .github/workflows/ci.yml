name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" scikit-learn
      - run: ruff format --check src tests scripts && ruff check src tests scripts
      - run: python -m pytest -q
      - name: held-out lock still verifies
        run: python scripts/lock.py verify
      - name: generated reports are up to date
        run: |
          python scripts/report.py
          git diff --exit-code RESULTS.md web/public/data/dashboard.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src test
      - run: npx vitest run
      - run: npx vite build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edd:ci .
